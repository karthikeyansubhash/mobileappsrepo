name: PR Diff Reviewer

on:
  pull_request:
    types:
      - opened
      - open
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get PR diff
        run: |
          git diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            > pr-diff.txt

      - name: Display PR diff
        run: |
          echo "===== PR DIFF ====="
          cat pr-diff.txt
